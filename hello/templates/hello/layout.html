<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{% endblock %}</title>
    {% load static %}
    <link rel="stylesheet" type="text/css" href="{% static 'hello/site.css' %}" />
</head>

<body>
    <div class="navbar">
        <div class="navbar-container">
            <a href="{% url 'home' %}" class="navbar-brand">
                <span class="icon">📋</span> ToDo App
            </a>
            <div class="navbar-menu">
                <a href="{% url 'home' %}" class="navbar-item">
                    <span class="icon">🏠</span> Home
                </a>
                <a href="{% url 'log' %}" class="navbar-item">
                    <span class="icon">➕</span> Add Task
                </a>
                <a href="{% url 'about' %}" class="navbar-item">
                    <span class="icon">ℹ️</span> About
                </a>
            </div>
        </div>
    </div>

    <div class="body-content">
        <div class="container">
            {% block content %}
            {% endblock %}
        </div>
        <footer class="footer">
            <div class="footer-content">
                <p><span class="icon">©</span> 2024 ToDo App - Built with <span class="icon" style="color: #ef4444;">❤️</span> using Django</p>
            </div>
        </footer>
    </div>
</body>

</html>
